# ==========================================================
# SPRING BOOT APPLICATION CONFIGURATION
# College Academic Project: Student Club Activity Tracker
# ==========================================================

# Server Port
server.port=8080

# MySQL Database Connection Details
spring.datasource.url=jdbc:mysql://localhost:3306/student_club_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# update mode preserves our sample data while validating entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging Level
logging.level.com.tracker.club=INFO
